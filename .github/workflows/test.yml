name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: scripts/codex_backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci --ignore-scripts --prefix scripts/codex_backend
      - run: npm test --prefix scripts/codex_backend
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/python/test_codex_backend.py
      - name: Shell syntax
        run: find scripts -name '*.sh' -exec bash -n {} \;
